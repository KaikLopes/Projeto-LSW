<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backlog de Jogos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎮 Meus Jogos (Miniprojeto 2)</h1>
        
        <div class="card add-game">
            <h3>Adicionar Novo Jogo</h3>
            <input type="text" id="titulo" placeholder="Nome do Jogo (ex: GTA VI)">
            <input type="text" id="status" placeholder="Status (ex: Zerado)">
            <button onclick="adicionarJogo()">Salvar Jogo (POST)</button>
        </div>

        <hr>

        <div id="lista-jogos">
            <p>Carregando jogos...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
